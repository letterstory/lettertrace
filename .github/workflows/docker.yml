name: Publish container image

# Builds and pushes ghcr.io/letterstory/lettertrace.
#
# Publishing the image is the whole point of the exercise: a Dockerfile alone
# still asks someone to clone the repo and build it. An image means one
# `docker run` and no toolchain.
#
# Pull requests build but do not push — so a broken Dockerfile is caught in
# review without publishing anything.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - next.config.mjs
      - .github/workflows/docker.yml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # arm64 is built under QEMU emulation, which costs ~20 minutes on top of
      # the amd64 build. That is worth paying for a release — most people
      # evaluating this locally are on an Apple Silicon laptop, and an
      # amd64-only image greets them with an emulation warning — but not on
      # every merge to master, on a repo that sees several a day.
      #
      # So: master publishes amd64 only, tags publish both. `latest` stays
      # instant, and anyone pulling a version tag gets their native arch.
      - id: platforms
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "list=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          else
            echo "list=linux/amd64" >> "$GITHUB_OUTPUT"
          fi

      - if: startsWith(github.ref, 'refs/tags/')
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.platforms.outputs.list }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
