# The checks that were only ever run by whoever remembered.
#
# The suite is worth something — it has caught real bugs — but a suite that only
# runs locally protects the person who ran it, not the branch. This runs the
# same four gates on every push and every pull request, in the order that fails
# fastest: typecheck (seconds) before build (a minute), so an obvious break
# doesn't wait on a bundle.
#
# Deliberately requires NO secrets. The whole pipeline was verified in a clean
# checkout with no .env of any kind, which is why it can also run on a fork's
# pull request. If a future change makes the build need a real key, that is
# worth noticing here rather than working around with a secret: the build
# reaching for a credential means it is doing something at build time that
# belongs at request time.
name: CI

on:
  push:
    branches: [master]
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant.
# Cancel it rather than paying for an answer nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, test, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # .nvmrc is the single source of truth for the version, so CI and a
          # developer's shell can't drift apart.
          node-version-file: .nvmrc
          cache: npm

      # ci, not install: build from the lockfile exactly, and fail if
      # package.json and the lockfile disagree.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  schema-drift:
    name: Schema drift (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Closes the gap behind INC-426 (2026-09-21/22): PR #202 shipped app code
    # that depended on new tables/columns supabase/schema.sql declared, but
    # nobody ran schema.sql against prod first -- there was no CI signal, so
    # it merged clean and broke every report start in production for ~7h.
    #
    # This repo has no supabase/migrations/ directory or Supabase-CLI
    # migration ledger -- schema.sql is a single hand-maintained file, applied
    # manually. So this isn't a port of letterstory/letterstory's
    # migration-order/schema-drift jobs (those read
    # supabase_migrations.schema_migrations, which doesn't exist here) --
    # it's a from-scratch check for the failure mode that's actually possible
    # in this repo's schema model: does every CREATE TABLE / ADD COLUMN in
    # schema.sql actually exist in prod, checked via the read-only Management
    # API (scripts/check-schema-drift.sh).
    #
    # Needs SUPABASE_ACCESS_TOKEN, unlike every other job in this file (see
    # this workflow's header comment on why CI is otherwise secret-free) --
    # this repo is public, so a fork's pull_request run gets no secret and
    # this job fails for external contributors touching schema.sql. That's a
    # deliberate tradeoff: catching the exact bug that caused a 7h prod
    # outage is worth an external contributor occasionally needing a
    # maintainer to apply the schema and re-run, rather than silently
    # skipping the check on any PR.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Check for drift against prod's schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bash scripts/check-schema-drift.sh
